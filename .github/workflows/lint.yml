name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # Blocking maturity gate (docs/MATURITY.md): do not remove or set continue-on-error.
      - name: awesome-lint
        run: npx awesome-lint@2.3.0 README.md
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            README.md
            contributing.md

      - name: No email addresses in README (People policy clause 3)
        run: |
          if grep -nE '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z0-9-.]+\b' README.md; then
            echo "::error::Email address found in README.md; People policy clause 3 forbids it."
            exit 1
          fi
